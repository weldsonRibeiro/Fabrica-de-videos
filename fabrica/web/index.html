<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3e6cf">
<title>Fábrica de Vídeos</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --texto: #14181f; --suave: #5b6573; --linha: #e1e5ea;
    --marca: #2457d6; --marca-texto: #ffffff; --ok: #12805c; --alerta: #b45309; --erro: #b42318;
    --raio: 14px;
    --piso: #e8ecf2; --piso2: #dde3ec; --parede: #f4f6fa; --movel: #ffffff; --movel-linha: #b4bfcf;
    --madeira: #c9a276; --madeira-esc: #a97f52; --tela: #1b2330; --papel: #fbfcfe; --brilho: #ffd84d;
    --livro1: #e5484d; --livro2: #3e63dd; --livro3: #30a46c; --livro4: #f5a524; --livro5: #8e4ec6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --card: #171b22; --texto: #eef1f5; --suave: #9aa5b4; --linha: #2a313c;
            --marca: #6b93ff; --marca-texto: #0b1020; --ok: #4cc9a0; --alerta: #f0a94a; --erro: #ff8a7a;
            --piso: #141922; --piso2: #1a202b; --parede: #1b212c; --movel: #262f3d; --movel-linha: #3d495c;
            --madeira: #8c6b49; --madeira-esc: #6d5238; --tela: #090c11; --papel: #cfd6e2; --brilho: #ffd84d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 28px 0 10px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .saldo { background: var(--card); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 14px; font-weight: 600; white-space: nowrap; }
  .saldo.neg { color: var(--erro); } .saldo.pos { color: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 2px; font-size: 1.05rem; }
  .meta { color: var(--suave); font-size: .875rem; margin-bottom: 10px; }
  video.principal { width: 100%; border-radius: 10px; background: #000; aspect-ratio: 16/9; }
  fieldset { border: 0; padding: 0; margin: 14px 0 0; min-width: 0; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .opcao { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--linha);
           border-radius: 10px; margin-bottom: 8px; cursor: pointer; min-height: 44px; }
  .opcao:has(input:checked) { border-color: var(--marca); box-shadow: 0 0 0 1px var(--marca) inset; }
  .opcao input { margin-top: 3px; accent-color: var(--marca); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .thumb { position: relative; border: 2px solid var(--linha); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--bg); aspect-ratio: 16/9; }
  .thumb:has(input:checked) { border-color: var(--marca); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb input { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; accent-color: var(--marca); }
  .shorts { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .short { flex: 0 0 150px; scroll-snap-align: start; }
  .short video { width: 150px; aspect-ratio: 9/16; border-radius: 10px; background: #000; display: block; }
  .short span { display: block; font-size: .8rem; color: var(--suave); margin-top: 4px; }
  label.campo { display: block; font-weight: 600; margin-top: 14px; }
  input[type=datetime-local] { width: 100%; font: inherit; padding: 12px; margin-top: 6px; border-radius: 10px;
         border: 1px solid var(--linha); background: var(--bg); color: var(--texto); min-height: 48px; }
  button.aprovar { width: 100%; margin-top: 16px; min-height: 52px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
         background: var(--marca); color: var(--marca-texto); cursor: pointer; }
  button.aprovar:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
  .msg.erro { color: var(--erro); } .msg.ok { color: var(--ok); }
  .vazio { color: var(--suave); text-align: center; padding: 28px 8px; }
  .linha { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); font-size: .92rem; }
  .linha:last-child { border-bottom: 0; }
  .selo { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; align-self: start; }
  .s-aguardando_aprovacao, .s-pausado { color: var(--alerta); } .s-agendado_no_canal { color: var(--ok); }
  .s-falhou { color: var(--erro); } .s-agendado, .s-em_producao, .s-aprovado { color: var(--suave); }
  .sem-midia { color: var(--suave); font-size: .85rem; padding: 14px; text-align: center; }
  /* ---- abas */
  nav.abas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--linha);
             border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  nav.abas button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: 9px; background: transparent;
             color: var(--suave); cursor: pointer; }
  nav.abas button[aria-selected=true] { background: var(--marca); color: var(--marca-texto); }
  .contador { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; font-size: .78rem;
              background: var(--alerta); color: #1a1100; }
  [hidden] { display: none !important; }


  .legenda { margin-top: 12px; }
  .func-linha { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linha); font-size: .92rem; }
  .func-linha:last-child { border-bottom: 0; }
  .avatar { flex: 0 0 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: #fff; }
  .func-linha .txt { flex: 1; min-width: 0; }
  .func-linha .txt strong, .func-linha .txt div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra { height: 5px; border-radius: 3px; background: var(--linha); margin-top: 5px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--marca); border-radius: 3px; transition: width .6s; }
  .canais { display: grid; gap: 12px; }
  .canal { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px; border-left: 5px solid var(--cor, var(--marca)); }
  .canal h3 { margin: 0; font-size: 1.05rem; }
  .canal .sub { color: var(--suave); font-size: .85rem; margin: 2px 0 10px; }
  .canal dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: .9rem; }
  .canal dt { color: var(--suave); } .canal dd { margin: 0; overflow-wrap: anywhere; }
  .canal .vazio-perfil { color: var(--suave); font-size: .88rem; }
  .extrato .linha .v { font-weight: 700; white-space: nowrap; } .v.pos { color: var(--ok); } .v.neg { color: var(--erro); }

  /* ---- jogo (tela cheia) ---- */
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: #f3e6cf; }
  #jogo { position: fixed; inset: 0; background: #f3e6cf; }
  #mapa { width: 100%; height: 100%; display: block; touch-action: none; image-rendering: pixelated; cursor: grab; }
  #hud { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
  .pilula-hud { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: rgba(24, 26, 33, .92); color: #fff; border-radius: 999px;
                padding: 8px 14px; font-weight: 800; font-size: .95rem; box-shadow: 0 4px 14px rgba(0,0,0,.25); min-width: 0; }
  .pilula-hud .moeda { color: #ffd34d; } .pilula-hud small { font-weight: 700; font-size: .72rem; opacity: .85; white-space: nowrap; }
  .pilula-hud .pos { color: #6fe3a6; } .pilula-hud .neg { color: #ff8a7a; }
  #btn-painel { pointer-events: auto; border: 0; border-radius: 999px; background: #ffd34d; color: #3a2a00; font: inherit; font-weight: 800;
                padding: 11px 18px; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; min-height: 44px; }
  #btn-painel .contador { background: #e5484d; color: #fff; }
  #zoom { position: absolute; right: 10px; bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 8px; }
  #zoom button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(24,26,33,.92); color: #fff; font-size: 1.3rem; font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }
  #dica { position: absolute; left: 10px; right: 10px; top: calc(max(10px, env(safe-area-inset-top)) + 62px); width: max-content; max-width: calc(100% - 20px); margin: 0 auto; background: rgba(24,26,33,.78); color: #fff; font-size: .78rem; padding: 6px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; font-size: .74rem; transition: opacity .6s; }
  #cartao-agente { position: absolute; left: 10px; right: 64px; bottom: max(16px, env(safe-area-inset-bottom)); background: rgba(24,26,33,.95); color: #fff; border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #cartao-agente h3 { margin: 0; font-size: 1.05rem; } #cartao-agente .sub { opacity: .8; font-size: .85rem; margin: 2px 0 8px; }
  #cartao-agente .barra { background: rgba(255,255,255,.2); } #cartao-agente .fechar { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: #fff; font-size: 1.2rem; cursor: pointer; }
  #cartao-agente .btn { margin-top: 10px; border: 0; border-radius: 10px; padding: 10px 14px; background: #ffd34d; color: #3a2a00; font: inherit; font-weight: 800; cursor: pointer; }

  /* ---- painel (folha por cima do jogo) ---- */
  #painel { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 5; -webkit-overflow-scrolling: touch; }
  #painel .miolo { max-width: 720px; margin: 0 auto; padding: 12px 16px 60px; }
  #painel header.topo { display: block; justify-content: normal; align-items: normal; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: max(10px, env(safe-area-inset-top)) 0 8px; margin: 0 0 4px; }
  .topo-linha h1 { font-size: 1.25rem; margin: 0; white-space: nowrap; }
  .voltar { white-space: nowrap; }
  .topo-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .voltar { border: 0; border-radius: 999px; background: var(--card); border: 1px solid var(--linha); color: var(--texto); font: inherit; font-weight: 700; padding: 9px 16px; min-height: 44px; cursor: pointer; }
  nav.abas { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 4px; scrollbar-width: none; background: none; border: 0; margin: 0; }
  nav.abas::-webkit-scrollbar { display: none; }
  nav.abas button { flex: 0 0 auto; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linha); background: var(--card); color: var(--suave); font: inherit; font-weight: 700; min-height: 44px; cursor: pointer; }
  nav.abas button[aria-selected=true] { background: var(--marca); color: var(--marca-texto); border-color: var(--marca); }
  .estado-maestro { display: flex; gap: 10px; align-items: center; }
  .luz { width: 10px; height: 10px; border-radius: 50%; background: var(--suave); flex: 0 0 auto; } .luz.ligado { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
  .fila { display: grid; grid-template-columns: 3.6em 1fr; gap: 2px 10px; padding: 11px 0; border-bottom: 1px solid var(--linha); align-items: start; }
  .fila .selo { grid-column: 2; justify-self: start; margin-top: 2px; }
  .fila:last-child { border-bottom: 0; } .fila .hora { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 3.4em; }
  table.semana { width: 100%; border-collapse: collapse; font-size: .9rem; } table.semana th { text-align: left; color: var(--suave); font-size: .75rem; text-transform: uppercase; padding: 6px 4px; }
  table.semana td { padding: 10px 4px; border-top: 1px solid var(--linha); }
</style>
</head>
<body>
<div id="jogo">
  <canvas id="mapa" aria-label="Escritório da fábrica de vídeos: salas dos canais, agentes trabalhando e sala de descanso"></canvas>
  <div id="hud">
    <div class="pilula-hud" title="Saldo da empresa no jogo">
      <span class="moeda">🪙 <b id="h-saldo">—</b></span>
      <small id="h-taxa" class="pos"></small><small id="h-gasto" class="neg"></small>
    </div>
    <button id="btn-painel" type="button">Painel<span id="h-pend" class="contador" hidden>0</span></button>
  </div>
  <div id="zoom"><button id="z-mais" aria-label="Aproximar">+</button><button id="z-menos" aria-label="Afastar">−</button><button id="z-ajustar" aria-label="Ver tudo">⤢</button></div>
  <div id="dica">Arraste para mover · pince para dar zoom · toque numa sala</div>
  <div id="cartao-agente" hidden></div>
</div>

<div id="painel" hidden>
  <div class="miolo">
    <header class="topo">
      <div class="topo-linha"><h1>🏭 Painel</h1><button class="voltar" id="btn-voltar" type="button">← Escritório</button></div>
      <nav class="abas" role="tablist" aria-label="Seções do painel">
        <button role="tab" data-aba="aprovar" aria-selected="true">✅ Aprovar<span id="contador" class="contador" hidden>0</span></button>
        <button role="tab" data-aba="agenda" aria-selected="false">📅 Agenda</button>
        <button role="tab" data-aba="canais" aria-selected="false">📺 Canais</button>
        <button role="tab" data-aba="caixa" aria-selected="false">🪙 Caixa</button>
        <button role="tab" data-aba="fabrica" aria-selected="false">🏭 Fábrica</button>
      </nav>
    </header>
    <section data-painel="aprovar" role="tabpanel"><h2 id="titulo-pendentes">Para aprovar</h2><div id="pendentes"></div></section>
    <section data-painel="agenda" role="tabpanel" hidden>
      <h2>Agenda de produção</h2>
      <div class="card"><div class="estado-maestro"><span id="luz-maestro" class="luz"></span><div><strong id="txt-maestro">Maestro</strong><div class="meta" id="sub-maestro"></div></div></div></div>
      <h2>Próximas produções</h2><div id="proximas" class="card"></div>
      <h2>A semana</h2><div class="card"><table class="semana"><thead><tr><th>Canal</th><th>Hora</th><th>Dias</th></tr></thead><tbody id="semana"></tbody></table></div>
    </section>
    <section data-painel="canais" role="tabpanel" hidden><h2>Canais e perfis</h2><div id="canais" class="canais"></div></section>
    <section data-painel="caixa" role="tabpanel" hidden><h2>Caixa da empresa</h2><div id="extrato" class="card extrato"></div></section>
    <section data-painel="fabrica" role="tabpanel" hidden><h2>Na linha de produção</h2><div id="legenda" class="card legenda"></div><h2>Todos os vídeos</h2><div id="fabrica" class="card"></div></section>
  </div>
</div>

<script src="/escritorio.js"></script>
<script src="/escritorio-motor.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...filhos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "texto") n.textContent = v; else n[k] = v;
  }
  for (const f of filhos) n.append(f);
  return n;
};
const ROTULOS = { agendado: "na agenda", em_producao: "produzindo", pausado: "pausado (retoma sozinho)",
  aguardando_aprovacao: "aguardando você", aprovado: "aprovado", agendado_no_canal: "agendado no canal", falhou: "falhou" };


let estado = null;
const cartoes = new Map(); // id -> elemento (preserva o que você já escolheu quando a lista atualiza)

async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { credentials: "same-origin", ...opcoes });
  if (r.status === 401) { document.body.textContent = "Acesso negado. Abra o link com a chave (?k=...)."; throw new Error("401"); }
  const dados = await r.json();
  if (!r.ok) throw new Error(dados.erro || r.statusText);
  return dados;
}

function sugestaoDeHorario() {
  const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function cartao(v) {
  const nome = "g" + v.id;
  const msg = el("div", { class: "msg", role: "status" });
  const botao = el("button", { class: "aprovar", type: "button", texto: "Aprovar e agendar" });
  const horario = el("input", { type: "datetime-local", value: sugestaoDeHorario(), id: "h" + v.id });

  const titulos = el("fieldset", {}, el("legend", { texto: "Título" }));
  v.titulos.forEach((t, i) => {
    const r = el("input", { type: "radio", name: nome + "t", value: i, checked: i === 0 });
    titulos.append(el("label", { class: "opcao" }, r, el("span", { texto: t })));
  });

  const thumbs = el("fieldset", {}, el("legend", { texto: "Thumbnail" }));
  const grade = el("div", { class: "thumbs" });
  v.thumbnails.forEach((u, i) => {
    const r = el("input", { type: "radio", name: nome + "i", value: i, checked: i === 0, ariaLabel: "Thumbnail " + (i + 1) });
    const img = el("img", { src: u, alt: "Thumbnail " + (i + 1), loading: "lazy" });
    img.onerror = () => img.replaceWith(el("div", { class: "sem-midia", texto: "(sem imagem)" }));
    grade.append(el("label", { class: "thumb" }, img, r));
  });
  thumbs.append(grade);

  const corpo = [el("h3", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · custo ${v.custo.toFixed(2)}` })];
  const player = el("video", { class: "principal", controls: true, preload: "metadata", playsInline: true, src: v.video });
  player.onerror = () => player.replaceWith(el("div", { class: "sem-midia", texto: "(vídeo indisponível)" }));
  corpo.push(player, titulos, thumbs);

  if (v.shorts.length) {
    const lista = el("div", { class: "shorts" });
    v.shorts.forEach((s) => lista.append(el("div", { class: "short" },
      el("video", { controls: true, preload: "none", playsInline: true, src: s.url }), el("span", { texto: s.titulo }))));
    corpo.push(el("fieldset", {}, el("legend", { texto: `Shorts (${v.shorts.length}) — sobem junto` }), lista));
  }
  corpo.push(el("label", { class: "campo", htmlFor: "h" + v.id, texto: `Publicar em (${estado.fuso})` }), horario, botao, msg);

  const raiz = el("section", { class: "card" }, ...corpo);
  botao.onclick = async () => {
    msg.className = "msg"; msg.textContent = "";
    if (!horario.value) { msg.className = "msg erro"; msg.textContent = "Escolha o horário."; return; }
    botao.disabled = true;
    try {
      await api("/api/aprovar", { method: "POST", headers: { "Content-Type": "application/json", "X-Fabrica": "1" },
        body: JSON.stringify({ video: v.id,
          titulo: +raiz.querySelector(`input[name="${nome}t"]:checked`).value,
          thumbnail: +raiz.querySelector(`input[name="${nome}i"]:checked`).value,
          publicar_em: horario.value }) });
      msg.className = "msg ok"; msg.textContent = "Aprovado! A fábrica sobe e agenda na próxima batida.";
      setTimeout(atualizar, 1200);
    } catch (e) { msg.className = "msg erro"; msg.textContent = e.message; botao.disabled = false; }
  };
  return raiz;
}


const moeda = (n) => n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hhmm = (iso) => iso.slice(11, 16);
const quando = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)} ${iso.slice(11, 16)}`;
const CORES = ["#3e63dd", "#e5484d", "#30a46c", "#d9822b", "#8e4ec6", "#0a8aa6", "#c2417a"];
const corDoCanal = (nome) => { let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; };
const iniciais = (nome) => nome.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");


const ESTACAO_NOME = { pesquisa: "pesquisando na estante", roteiro: "escrevendo o roteiro", narracao: "gravando a narração",
  cenas: "desenhando as cenas", montagem: "montando o vídeo", thumbnail: "criando a thumbnail" };
const ETAPA_ROTULO = { pesquisa: "Estante", roteiro: "Roteiro", narracao: "Cabine", cenas: "Quadro", montagem: "Montagem", thumbnail: "Thumbnail" };

/* ---------- painel: abas ---------- */
function mostrarAba(qual) {
  document.querySelectorAll("[data-painel]").forEach((s) => { s.hidden = s.dataset.painel !== qual; });
  document.querySelectorAll("nav.abas button").forEach((b) => b.setAttribute("aria-selected", b.dataset.aba === qual));
  $("painel").scrollTo({ top: 0 });
}
function abrirPainel(aba) { $("painel").hidden = false; if (aba) mostrarAba(aba); }
function fecharPainel() { $("painel").hidden = true; }
document.querySelectorAll("nav.abas button").forEach((b) => { b.onclick = () => mostrarAba(b.dataset.aba); });
$("btn-painel").onclick = () => abrirPainel(estado && estado.pendentes.length ? "aprovar" : "agenda");
$("btn-voltar").onclick = fecharPainel;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") fecharPainel(); });

/* ---------- jogo ---------- */
const jogo = Escritorio.criar($("mapa"), {
  onAprovar: () => abrirPainel("aprovar"),
  onAgente: (info) => cartaoAgente(info),
});
$("z-mais").onclick = () => jogo.zoom(1.5);
$("z-menos").onclick = () => jogo.zoom(1 / 1.5);
$("z-ajustar").onclick = () => jogo.ajustar();
setTimeout(() => { $("dica").style.opacity = 0; }, 7000);

function cartaoAgente(info) {
  const c = $("cartao-agente");
  c.replaceChildren();
  if (!info) { c.hidden = true; return; }
  const fechar = el("button", { class: "fechar", type: "button", texto: "✕", ariaLabel: "Fechar" });
  fechar.onclick = () => { c.hidden = true; jogo.fechar(); };
  const rotuloStatus = info.dono ? "online" : { trabalhando: "trabalhando", pausado: "pausado — retoma sozinho", ocioso: "livre" }[info.status];
  c.append(fechar, el("h3", { texto: `${info.nome} · ${info.canal}` }), el("div", { class: "sub", texto: `${rotuloStatus} · ${info.verbo}` }));
  if (info.tema) c.append(el("div", { texto: `“${info.tema}”` }));
  if (info.progresso !== null && info.progresso !== undefined) c.append(el("div", { class: "barra" }, el("i", { style: `width:${Math.round(info.progresso * 100)}%` })));
  if (info.retomar_em) c.append(el("div", { class: "sub", texto: `retoma às ${hhmm(info.retomar_em)}` }));
  if (info.dono && info.pendentes) { const b = el("button", { class: "btn", type: "button", texto: `Aprovar ${info.pendentes} vídeo${info.pendentes > 1 ? "s" : ""}` }); b.onclick = () => abrirPainel("aprovar"); c.append(b); }
  c.hidden = false;
}

function desenharHud() {
  $("h-saldo").textContent = moeda(estado.saldo);
  $("h-taxa").textContent = estado.ganho_hora ? `+${moeda(estado.ganho_hora)}/h` : "";
  $("h-gasto").textContent = estado.gasto_hoje ? `−${moeda(estado.gasto_hoje)} hoje` : "";
  const n = estado.pendentes.length;
  for (const id of ["h-pend", "contador"]) { const c = $(id); c.textContent = n; c.hidden = !n; }
}

/* ---------- aprovação ---------- */
function desenharPendentes() {
  $("titulo-pendentes").textContent = `Para aprovar (${estado.pendentes.length})`;
  const area = $("pendentes");
  const ids = new Set(estado.pendentes.map((v) => v.id));
  for (const [id, no] of cartoes) if (!ids.has(id)) { no.remove(); cartoes.delete(id); }
  for (const v of estado.pendentes) if (!cartoes.has(v.id)) { const no = cartao(v); cartoes.set(v.id, no); area.append(no); }
  const vazio = area.querySelector(".vazio");
  if (!estado.pendentes.length && !vazio) area.append(el("div", { class: "vazio", texto: "Nada esperando você. A fábrica está trabalhando. 🎬" }));
  if (estado.pendentes.length && vazio) vazio.remove();
}

/* ---------- agenda ---------- */
function desenharAgenda() {
  const ligado = estado.ultimo_tick && (new Date(estado.agora) - new Date(estado.ultimo_tick)) < 180000;
  $("luz-maestro").classList.toggle("ligado", !!ligado);
  $("txt-maestro").textContent = ligado ? "Maestro ligado" : (estado.ultimo_tick ? "Maestro parado" : "Maestro aguardando a primeira batida");
  $("sub-maestro").textContent = estado.ultimo_tick ? `última batida às ${hhmm(estado.ultimo_tick)} · solta um vídeo por canal na hora certa e retoma sozinho quando a IA bate no limite` : "sem registro de batida neste servidor (use --com-maestro ou um cron)";
  const caixa = $("proximas"); caixa.replaceChildren();
  const fila = estado.videos.filter((v) => ["agendado", "em_producao", "pausado"].includes(v.status)).sort((a, b) => a.producao_em.localeCompare(b.producao_em));
  if (!fila.length) caixa.append(el("div", { class: "vazio", texto: "Nada na fila agora." }));
  for (const v of fila) {
    const quem = v.status === "agendado" ? `abre às ${hhmm(v.producao_em)}` : v.status === "em_producao" ? `produzindo · ${ESTACAO_NOME[v.etapa] || ""}` : `pausado${v.retomar_em ? ` · retoma ${hhmm(v.retomar_em)}` : ""}`;
    caixa.append(el("div", { class: "fila" }, el("span", { class: "hora", texto: hhmm(v.producao_em) }),
      el("div", { style: "min-width:0" }, el("strong", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · ${quando(v.producao_em)}` })),
      el("span", { class: "selo s-" + v.status, texto: quem })));
  }
  const t = $("semana"); t.replaceChildren();
  for (const c of estado.canais) t.append(el("tr", {}, el("td", { texto: c.nome }), el("td", { texto: c.inicio }), el("td", { texto: "todos os dias" })));
}

/* ---------- na linha de produção ---------- */
function desenharLegenda() {
  const l = $("legenda"); l.replaceChildren();
  const ativos = estado.videos.filter((v) => (v.status === "em_producao" || v.status === "pausado") && v.etapa);
  if (!ativos.length) { l.append(el("div", { class: "vazio", texto: "Ninguém na linha agora. 😴" })); return; }
  for (const v of ativos) {
    const pausado = v.status === "pausado";
    const txt = pausado ? `parado na etapa “${(ETAPA_ROTULO[v.etapa] || "").toLowerCase()}”${v.retomar_em ? ` · retoma ${hhmm(v.retomar_em)}` : ""}` : `${ESTACAO_NOME[v.etapa]} (${v.etapas_feitas + 1}/${v.etapas_total})`;
    l.append(el("div", { class: "func-linha" }, el("div", { class: "avatar", style: `background:${corDoCanal(v.canal)}`, texto: iniciais(v.canal) }),
      el("div", { class: "txt" }, el("strong", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · ${txt}` }),
        el("div", { class: "barra" }, el("i", { style: `width:${(v.etapas_feitas / v.etapas_total) * 100}%` })))));
  }
}
function desenharLista() {
  const f = $("fabrica"); f.replaceChildren();
  if (!estado.videos.length) f.append(el("div", { class: "vazio", texto: "Nenhum vídeo na agenda ainda." }));
  for (const v of estado.videos) {
    const detalhe = v.retomar_em ? ` · retoma ${quando(v.retomar_em)}` : "";
    f.append(el("div", { class: "linha" },
      el("div", {}, el("strong", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · ${quando(v.producao_em)}${detalhe}` + (v.erro ? ` · ${v.erro}` : "") })),
      el("span", { class: "selo s-" + v.status, texto: ROTULOS[v.status] || v.status })));
  }
}
function desenharExtrato() {
  const x = $("extrato");
  x.replaceChildren();
  if (!estado.historico.length) { x.append(el("div", { class: "vazio", texto: "Sem movimentações ainda." })); return; }
  const tema = (id) => (estado.videos.find((v) => v.id === id) || {}).tema || id;
  for (const h of estado.historico) {
    x.append(el("div", { class: "linha" },
      el("div", {}, el("strong", { texto: h.tipo === "despesa" ? "Produção" : "Views" }), el("div", { class: "meta", texto: tema(h.video) })),
      el("span", { class: "v " + (h.valor < 0 ? "neg" : "pos"), texto: (h.valor > 0 ? "+" : "−") + moeda(Math.abs(h.valor)) })));
  }
}

const CAMPOS_PERFIL = [["voz", "Voz"], ["estilo_voz", "Jeito de falar"], ["tom", "Tom"], ["publico", "Público"],
  ["estilo_visual", "Estilo visual"], ["cenas", "Cenas por vídeo"], ["categoria_youtube", "Categoria YouTube"], ["idioma", "Idioma"]];
function desenharCanais() {
  const area = $("canais");
  area.replaceChildren();
  if (!estado.canais.length) { area.append(el("div", { class: "vazio", texto: "Nenhum canal configurado." })); return; }
  for (const c of estado.canais) {
    const lista = el("dl");
    for (const [chave, rotulo] of CAMPOS_PERFIL) if (c.perfil[chave]) lista.append(el("dt", { texto: rotulo }), el("dd", { texto: String(c.perfil[chave]) }));
    if ((c.perfil.evitar || []).length) lista.append(el("dt", { texto: "Evita" }), el("dd", { texto: c.perfil.evitar.join(" · ") }));
    area.append(el("section", { class: "canal", style: `--cor:${corDoCanal(c.nome)}` },
      el("h3", { texto: c.nome }),
      el("div", { class: "sub", texto: `${c.nicho || "sem nicho"} · começa às ${c.inicio} · ${c.temas} tema${c.temas === 1 ? "" : "s"} na fila` }),
      lista.children.length ? lista : el("div", { class: "vazio-perfil", texto: "Sem perfil: usa as vozes e estilos padrão." })));
  }
}


function desenhar() {
  desenharHud(); desenharPendentes(); desenharAgenda(); desenharLegenda(); desenharLista(); desenharExtrato(); desenharCanais();
  jogo.atualizar(estado);
}

async function atualizar() {
  try { estado = await api("/api/estado"); estado.hoje = estado.agora.slice(0, 10); desenhar(); } catch (e) { if (e.message !== "401") console.error(e); }
}
atualizar();
setInterval(atualizar, 8000);
</script>
</body>
</html>
