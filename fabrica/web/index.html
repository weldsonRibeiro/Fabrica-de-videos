<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Fábrica de Vídeos</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --texto: #14181f; --suave: #5b6573; --linha: #e1e5ea;
    --marca: #2457d6; --marca-texto: #ffffff; --ok: #12805c; --alerta: #b45309; --erro: #b42318;
    --raio: 14px;
    --piso: #e8ecf2; --piso2: #dde3ec; --parede: #f4f6fa; --movel: #ffffff; --movel-linha: #b4bfcf;
    --madeira: #c9a276; --madeira-esc: #a97f52; --tela: #1b2330; --papel: #fbfcfe; --brilho: #ffd84d;
    --livro1: #e5484d; --livro2: #3e63dd; --livro3: #30a46c; --livro4: #f5a524; --livro5: #8e4ec6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --card: #171b22; --texto: #eef1f5; --suave: #9aa5b4; --linha: #2a313c;
            --marca: #6b93ff; --marca-texto: #0b1020; --ok: #4cc9a0; --alerta: #f0a94a; --erro: #ff8a7a;
            --piso: #141922; --piso2: #1a202b; --parede: #1b212c; --movel: #262f3d; --movel-linha: #3d495c;
            --madeira: #8c6b49; --madeira-esc: #6d5238; --tela: #090c11; --papel: #cfd6e2; --brilho: #ffd84d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--texto);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 28px 0 10px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .saldo { background: var(--card); border: 1px solid var(--linha); border-radius: 999px; padding: 6px 14px; font-weight: 600; white-space: nowrap; }
  .saldo.neg { color: var(--erro); } .saldo.pos { color: var(--ok); }
  .card { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 2px; font-size: 1.05rem; }
  .meta { color: var(--suave); font-size: .875rem; margin-bottom: 10px; }
  video.principal { width: 100%; border-radius: 10px; background: #000; aspect-ratio: 16/9; }
  fieldset { border: 0; padding: 0; margin: 14px 0 0; min-width: 0; }
  legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
  .opcao { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--linha);
           border-radius: 10px; margin-bottom: 8px; cursor: pointer; min-height: 44px; }
  .opcao:has(input:checked) { border-color: var(--marca); box-shadow: 0 0 0 1px var(--marca) inset; }
  .opcao input { margin-top: 3px; accent-color: var(--marca); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .thumb { position: relative; border: 2px solid var(--linha); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--bg); aspect-ratio: 16/9; }
  .thumb:has(input:checked) { border-color: var(--marca); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb input { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; accent-color: var(--marca); }
  .shorts { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .short { flex: 0 0 150px; scroll-snap-align: start; }
  .short video { width: 150px; aspect-ratio: 9/16; border-radius: 10px; background: #000; display: block; }
  .short span { display: block; font-size: .8rem; color: var(--suave); margin-top: 4px; }
  label.campo { display: block; font-weight: 600; margin-top: 14px; }
  input[type=datetime-local] { width: 100%; font: inherit; padding: 12px; margin-top: 6px; border-radius: 10px;
         border: 1px solid var(--linha); background: var(--bg); color: var(--texto); min-height: 48px; }
  button.aprovar { width: 100%; margin-top: 16px; min-height: 52px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
         background: var(--marca); color: var(--marca-texto); cursor: pointer; }
  button.aprovar:disabled { opacity: .55; cursor: default; }
  .msg { margin-top: 10px; font-size: .9rem; min-height: 1.2em; }
  .msg.erro { color: var(--erro); } .msg.ok { color: var(--ok); }
  .vazio { color: var(--suave); text-align: center; padding: 28px 8px; }
  .linha { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); font-size: .92rem; }
  .linha:last-child { border-bottom: 0; }
  .selo { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; align-self: start; }
  .s-aguardando_aprovacao, .s-pausado { color: var(--alerta); } .s-agendado_no_canal { color: var(--ok); }
  .s-falhou { color: var(--erro); } .s-agendado, .s-em_producao, .s-aprovado { color: var(--suave); }
  .sem-midia { color: var(--suave); font-size: .85rem; padding: 14px; text-align: center; }
  /* ---- abas */
  nav.abas { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--card); border: 1px solid var(--linha);
             border-radius: 12px; padding: 4px; margin-bottom: 12px; }
  nav.abas button { font: inherit; font-weight: 600; min-height: 44px; border: 0; border-radius: 9px; background: transparent;
             color: var(--suave); cursor: pointer; }
  nav.abas button[aria-selected=true] { background: var(--marca); color: var(--marca-texto); }
  .contador { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; font-size: .78rem;
              background: var(--alerta); color: #1a1100; }
  [hidden] { display: none !important; }

  /* ---- escritório */
  .cena { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 6px; }
  .cena svg { display: block; width: 100%; height: auto; }
  .cena text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .rotulo { font-size: 9.5px; font-weight: 700; fill: var(--suave); text-anchor: middle; letter-spacing: .02em; }
  .estacao .base { fill: var(--piso2); }
  .estacao.ativa .base { fill: color-mix(in srgb, var(--marca) 16%, var(--piso2)); stroke: var(--marca); stroke-width: 1.5; }
  .estacao.ativa .pulso { animation: pulso 1.6s ease-in-out infinite; }
  .estacao.parada .base { stroke: var(--alerta); stroke-width: 1.5; stroke-dasharray: 3 3; }
  @keyframes pulso { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .onda { animation: onda 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .estacao:not(.ativa) .onda { animation: none; opacity: .25; }
  @keyframes onda { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
  .trilha { animation: trilha 2.4s linear infinite; }
  .estacao:not(.ativa) .trilha { animation: none; }
  @keyframes trilha { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -24; } }
  .func { transition: transform 1.4s cubic-bezier(.45, .05, .25, 1); }
  .func .corpo { animation: balanco .9s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  .func.parado .corpo { animation: none; }
  @keyframes balanco { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.6px); } }
  .zzz { display: none; font-size: 9px; font-weight: 800; fill: var(--alerta); animation: sobe 2.2s ease-in-out infinite; }
  .func.parado .zzz { display: block; }
  @keyframes sobe { 0% { opacity: 0; transform: translateY(2px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-7px); } }
  .toque { cursor: pointer; }
  .selo-n { font-size: 9px; font-weight: 800; fill: #1a1100; text-anchor: middle; }
  .moeda-txt { font-size: 11px; font-weight: 800; text-anchor: middle; }
  @media (prefers-reduced-motion: reduce) { .func, .func .corpo, .onda, .trilha, .zzz, .pulso { animation: none !important; transition: none !important; } }
  .legenda { margin-top: 12px; }
  .func-linha { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linha); font-size: .92rem; }
  .func-linha:last-child { border-bottom: 0; }
  .avatar { flex: 0 0 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 800; color: #fff; }
  .func-linha .txt { flex: 1; min-width: 0; }
  .func-linha .txt strong, .func-linha .txt div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra { height: 5px; border-radius: 3px; background: var(--linha); margin-top: 5px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--marca); border-radius: 3px; transition: width .6s; }
  .canais { display: grid; gap: 12px; }
  .canal { background: var(--card); border: 1px solid var(--linha); border-radius: var(--raio); padding: 14px; border-left: 5px solid var(--cor, var(--marca)); }
  .canal h3 { margin: 0; font-size: 1.05rem; }
  .canal .sub { color: var(--suave); font-size: .85rem; margin: 2px 0 10px; }
  .canal dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: .9rem; }
  .canal dt { color: var(--suave); } .canal dd { margin: 0; overflow-wrap: anywhere; }
  .canal .vazio-perfil { color: var(--suave); font-size: .88rem; }
  .extrato .linha .v { font-weight: 700; white-space: nowrap; } .v.pos { color: var(--ok); } .v.neg { color: var(--erro); }
</style>
</head>
<body>
<main>
  <header>
    <h1>🏭 Fábrica de Vídeos</h1>
    <div id="saldo" class="saldo" title="Saldo da empresa no jogo">—</div>
  </header>

  <nav class="abas" role="tablist" aria-label="Seções">
    <button role="tab" id="aba-escritorio" aria-selected="true" aria-controls="painel-escritorio">🏢 Escritório</button>
    <button role="tab" id="aba-aprovar" aria-selected="false" aria-controls="painel-aprovar">✅ Aprovar<span id="contador" class="contador" hidden>0</span></button>
  </nav>

  <section id="painel-escritorio" role="tabpanel" aria-labelledby="aba-escritorio">
    <div class="cena"><svg id="cena" viewBox="0 0 360 436" role="img" aria-label="Escritório da fábrica de vídeos"></svg></div>
    <div id="legenda" class="card legenda"></div>
    <h2>Caixa da empresa</h2>
    <div id="extrato" class="card extrato"></div>
    <h2>Canais e perfis</h2>
    <div id="canais" class="canais"></div>
    <h2>Na fábrica</h2>
    <div id="fabrica" class="card"></div>
  </section>

  <section id="painel-aprovar" role="tabpanel" aria-labelledby="aba-aprovar" hidden>
    <h2 id="titulo-pendentes">Para aprovar</h2>
    <div id="pendentes"></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...filhos) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "texto") n.textContent = v; else n[k] = v;
  }
  for (const f of filhos) n.append(f);
  return n;
};
const ROTULOS = { agendado: "na agenda", em_producao: "produzindo", pausado: "pausado (retoma sozinho)",
  aguardando_aprovacao: "aguardando você", aprovado: "aprovado", agendado_no_canal: "agendado no canal", falhou: "falhou" };

let estado = null;
const cartoes = new Map(); // id -> elemento (preserva o que você já escolheu quando a lista atualiza)

async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { credentials: "same-origin", ...opcoes });
  if (r.status === 401) { document.body.textContent = "Acesso negado. Abra o link com a chave (?k=...)."; throw new Error("401"); }
  const dados = await r.json();
  if (!r.ok) throw new Error(dados.erro || r.statusText);
  return dados;
}

function sugestaoDeHorario() {
  const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(18, 0, 0, 0);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function cartao(v) {
  const nome = "g" + v.id;
  const msg = el("div", { class: "msg", role: "status" });
  const botao = el("button", { class: "aprovar", type: "button", texto: "Aprovar e agendar" });
  const horario = el("input", { type: "datetime-local", value: sugestaoDeHorario(), id: "h" + v.id });

  const titulos = el("fieldset", {}, el("legend", { texto: "Título" }));
  v.titulos.forEach((t, i) => {
    const r = el("input", { type: "radio", name: nome + "t", value: i, checked: i === 0 });
    titulos.append(el("label", { class: "opcao" }, r, el("span", { texto: t })));
  });

  const thumbs = el("fieldset", {}, el("legend", { texto: "Thumbnail" }));
  const grade = el("div", { class: "thumbs" });
  v.thumbnails.forEach((u, i) => {
    const r = el("input", { type: "radio", name: nome + "i", value: i, checked: i === 0, ariaLabel: "Thumbnail " + (i + 1) });
    const img = el("img", { src: u, alt: "Thumbnail " + (i + 1), loading: "lazy" });
    img.onerror = () => img.replaceWith(el("div", { class: "sem-midia", texto: "(sem imagem)" }));
    grade.append(el("label", { class: "thumb" }, img, r));
  });
  thumbs.append(grade);

  const corpo = [el("h3", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · custo ${v.custo.toFixed(2)}` })];
  const player = el("video", { class: "principal", controls: true, preload: "metadata", playsInline: true, src: v.video });
  player.onerror = () => player.replaceWith(el("div", { class: "sem-midia", texto: "(vídeo indisponível)" }));
  corpo.push(player, titulos, thumbs);

  if (v.shorts.length) {
    const lista = el("div", { class: "shorts" });
    v.shorts.forEach((s) => lista.append(el("div", { class: "short" },
      el("video", { controls: true, preload: "none", playsInline: true, src: s.url }), el("span", { texto: s.titulo }))));
    corpo.push(el("fieldset", {}, el("legend", { texto: `Shorts (${v.shorts.length}) — sobem junto` }), lista));
  }
  corpo.push(el("label", { class: "campo", htmlFor: "h" + v.id, texto: `Publicar em (${estado.fuso})` }), horario, botao, msg);

  const raiz = el("section", { class: "card" }, ...corpo);
  botao.onclick = async () => {
    msg.className = "msg"; msg.textContent = "";
    if (!horario.value) { msg.className = "msg erro"; msg.textContent = "Escolha o horário."; return; }
    botao.disabled = true;
    try {
      await api("/api/aprovar", { method: "POST", headers: { "Content-Type": "application/json", "X-Fabrica": "1" },
        body: JSON.stringify({ video: v.id,
          titulo: +raiz.querySelector(`input[name="${nome}t"]:checked`).value,
          thumbnail: +raiz.querySelector(`input[name="${nome}i"]:checked`).value,
          publicar_em: horario.value }) });
      msg.className = "msg ok"; msg.textContent = "Aprovado! A fábrica sobe e agenda na próxima batida.";
      setTimeout(atualizar, 1200);
    } catch (e) { msg.className = "msg erro"; msg.textContent = e.message; botao.disabled = false; }
  };
  return raiz;
}

function desenhar() {
  const s = $("saldo");
  s.textContent = `🪙 ${estado.saldo.toFixed(2)}`;
  s.className = "saldo " + (estado.saldo < 0 ? "neg" : "pos");

  const c = $("contador");
  c.textContent = estado.pendentes.length; c.hidden = !estado.pendentes.length;
  desenharCena(); desenharLegenda(); desenharExtrato(); desenharCanais();
  $("titulo-pendentes").textContent = `Para aprovar (${estado.pendentes.length})`;
  const area = $("pendentes");
  const ids = new Set(estado.pendentes.map((v) => v.id));
  for (const [id, no] of cartoes) if (!ids.has(id)) { no.remove(); cartoes.delete(id); }
  for (const v of estado.pendentes) if (!cartoes.has(v.id)) { const no = cartao(v); cartoes.set(v.id, no); area.append(no); }
  const vazio = area.querySelector(".vazio");
  if (!estado.pendentes.length && !vazio) area.append(el("div", { class: "vazio", texto: "Nada esperando você. A fábrica está trabalhando. 🎬" }));
  if (estado.pendentes.length && vazio) vazio.remove();

  const f = $("fabrica");
  f.replaceChildren();
  if (!estado.videos.length) f.append(el("div", { class: "vazio", texto: "Nenhum vídeo na agenda ainda." }));
  for (const v of estado.videos) {
    const detalhe = v.retomar_em ? ` · retoma ${quando(v.retomar_em)}` : "";
    f.append(el("div", { class: "linha" },
      el("div", {}, el("strong", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · ${quando(v.producao_em)}${detalhe}` + (v.erro ? ` · ${v.erro}` : "") })),
      el("span", { class: "selo s-" + v.status, texto: ROTULOS[v.status] || v.status })));
  }
}


const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}, ...filhos) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "texto") n.textContent = v; else n.setAttribute(k, v); }
  for (const f of filhos) if (f) n.append(f);
  return n;
};
const moeda = (n) => n.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const hhmm = (iso) => iso.slice(11, 16);
const quando = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)} ${iso.slice(11, 16)}`;

const ETAPAS = ["pesquisa", "roteiro", "narracao", "cenas", "montagem", "thumbnail"];
const ESTACOES = {
  pesquisa:  { nome: "Estante",   verbo: "pesquisando na estante",   x: 12,  y: 14 },
  roteiro:   { nome: "Roteiro",   verbo: "escrevendo o roteiro",     x: 125, y: 14 },
  narracao:  { nome: "Cabine",    verbo: "gravando a narração",      x: 238, y: 14 },
  cenas:     { nome: "Quadro",    verbo: "desenhando as cenas",      x: 12,  y: 164 },
  montagem:  { nome: "Montagem",  verbo: "montando o vídeo",         x: 125, y: 164 },
  thumbnail: { nome: "Thumbnail", verbo: "criando a thumbnail",      x: 238, y: 164 },
};
const CORES = ["#3e63dd", "#e5484d", "#30a46c", "#d9822b", "#8e4ec6", "#0a8aa6", "#c2417a"];
const corDoCanal = (nome) => { let h = 0; for (const c of nome) h = (h * 31 + c.charCodeAt(0)) >>> 0; return CORES[h % CORES.length]; };
const iniciais = (nome) => nome.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join("");

/* ---- desenho de cada estação (caixa de 100 x 100) */
const R = (x, y, w, h, cls, extra = {}) => sv("rect", { x, y, width: w, height: h, rx: 2, class: cls, ...extra });
const MOVEL = { fill: "var(--movel)", stroke: "var(--movel-linha)", "stroke-width": 1 };
function arte(etapa) {
  const g = sv("g");
  if (etapa === "pesquisa") {              // estante com livros
    g.append(sv("rect", { x: 14, y: 8, width: 72, height: 78, rx: 3, ...MOVEL }));
    const livros = ["--livro1", "--livro2", "--livro3", "--livro4", "--livro5"];
    [0, 1, 2].forEach((prat) => {
      const y = 12 + prat * 25;
      g.append(sv("line", { x1: 14, x2: 86, y1: y + 21, y2: y + 21, stroke: "var(--movel-linha)", "stroke-width": 1.5 }));
      let x = 19;
      for (let i = 0; i < 6; i++) {
        const w = 6 + ((i + prat) % 3) * 2, h = 15 + ((i * 3 + prat) % 4) * 1.5;
        g.append(sv("rect", { x, y: y + 21 - h, width: w, height: h, rx: 1, fill: `var(${livros[(i + prat * 2) % 5]})` }));
        x += w + 1.6;
      }
    });
  } else if (etapa === "roteiro") {         // mesa com folha, caneta e abajur
    g.append(sv("rect", { x: 6, y: 44, width: 88, height: 40, rx: 4, fill: "var(--madeira)" }));
    g.append(sv("rect", { x: 6, y: 78, width: 88, height: 8, rx: 3, fill: "var(--madeira-esc)" }));
    g.append(sv("rect", { x: 26, y: 50, width: 34, height: 26, rx: 2, fill: "var(--papel)", stroke: "var(--movel-linha)" }));
    [57, 62, 67, 72].forEach((y, i) => g.append(sv("line", { x1: 30, x2: 55 - (i % 2) * 6, y1: y - 2, y2: y - 2, stroke: "var(--movel-linha)", "stroke-width": 1.4 })));
    g.append(sv("line", { x1: 66, y1: 72, x2: 80, y2: 54, stroke: "var(--marca)", "stroke-width": 2.4, "stroke-linecap": "round" }));
    g.append(sv("line", { x1: 82, y1: 46, x2: 74, y2: 24, stroke: "var(--movel-linha)", "stroke-width": 2 }));
    g.append(sv("path", { d: "M66 26 L82 26 L78 14 L70 14 Z", fill: "var(--brilho)" }));
  } else if (etapa === "narracao") {        // cabine com microfone
    g.append(sv("rect", { x: 16, y: 8, width: 68, height: 78, rx: 8, ...MOVEL }));
    g.append(sv("rect", { x: 24, y: 16, width: 52, height: 40, rx: 4, fill: "var(--tela)", opacity: .9 }));
    g.append(sv("circle", { cx: 50, cy: 34, r: 7, fill: "none", stroke: "var(--movel-linha)", "stroke-width": 2 }));
    g.append(sv("line", { x1: 50, y1: 41, x2: 50, y2: 56, stroke: "var(--movel-linha)", "stroke-width": 2 }));
    [[32, 8], [38, 16], [62, 16], [68, 8]].forEach(([x, h], i) =>
      g.append(sv("rect", { class: "onda", x: x - 1.5, y: 36 - h / 2, width: 3, height: h, rx: 1.5, fill: "var(--marca)", style: `animation-delay:${i * .18}s` })));
    g.append(sv("rect", { x: 24, y: 62, width: 52, height: 16, rx: 3, fill: "var(--piso2)" }));
    g.append(sv("circle", { cx: 34, cy: 70, r: 3, fill: "var(--erro)" }));
  } else if (etapa === "cenas") {           // quadro branco com cenas desenhadas
    g.append(sv("rect", { x: 6, y: 10, width: 88, height: 62, rx: 3, fill: "var(--papel)", stroke: "var(--movel-linha)", "stroke-width": 2 }));
    [[12, "var(--livro2)"], [38, "var(--livro3)"], [64, "var(--livro4)"]].forEach(([x, cor], i) => {
      g.append(sv("rect", { x, y: 18, width: 24, height: 18, rx: 2, fill: "none", stroke: "var(--movel-linha)", "stroke-width": 1.2 }));
      g.append(sv("path", { d: `M${x + 2} 34 L${x + 9} 24 L${x + 14} 30 L${x + 18} 26 L${x + 22} 34 Z`, fill: cor, opacity: .85 }));
      g.append(sv("circle", { cx: x + 18, cy: 22, r: 2.2, fill: "var(--brilho)" }));
    });
    g.append(sv("line", { x1: 12, y1: 50, x2: 80, y2: 50, class: "trilha", stroke: "var(--marca)", "stroke-width": 2, "stroke-dasharray": "5 7", "stroke-linecap": "round" }));
    g.append(sv("line", { x1: 12, y1: 60, x2: 52, y2: 60, stroke: "var(--movel-linha)", "stroke-width": 1.6 }));
    g.append(sv("rect", { x: 30, y: 72, width: 40, height: 5, rx: 2, fill: "var(--movel-linha)" }));
  } else if (etapa === "montagem") {        // monitor com linha do tempo
    g.append(sv("rect", { x: 10, y: 8, width: 80, height: 54, rx: 4, fill: "var(--tela)", stroke: "var(--movel-linha)", "stroke-width": 2 }));
    g.append(sv("rect", { x: 16, y: 14, width: 30, height: 20, rx: 2, fill: "var(--livro2)", opacity: .75 }));
    g.append(sv("path", { d: "M26 19 L26 29 L35 24 Z", fill: "#fff" }));
    [[16, 40, 26, "--livro3"], [44, 40, 18, "--livro4"], [64, 40, 20, "--livro5"], [16, 48, 14, "--livro1"], [32, 48, 34, "--livro2"]].forEach(([x, y, w, c]) =>
      g.append(sv("rect", { x, y, width: w, height: 5, rx: 1.5, fill: `var(${c})`, opacity: .9 })));
    g.append(sv("line", { x1: 40, y1: 36, x2: 40, y2: 57, stroke: "var(--brilho)", "stroke-width": 1.4 }));
    g.append(sv("rect", { x: 44, y: 62, width: 12, height: 8, ...MOVEL }));
    g.append(sv("rect", { x: 26, y: 70, width: 48, height: 12, rx: 3, ...MOVEL }));
  } else {                                   // thumbnail: cavalete com a arte
    g.append(sv("line", { x1: 50, y1: 66, x2: 30, y2: 90, stroke: "var(--madeira-esc)", "stroke-width": 3, "stroke-linecap": "round" }));
    g.append(sv("line", { x1: 50, y1: 66, x2: 70, y2: 90, stroke: "var(--madeira-esc)", "stroke-width": 3, "stroke-linecap": "round" }));
    g.append(sv("rect", { x: 12, y: 12, width: 76, height: 54, rx: 3, fill: "var(--papel)", stroke: "var(--madeira)", "stroke-width": 3 }));
    g.append(sv("rect", { x: 18, y: 18, width: 64, height: 42, rx: 2, fill: "var(--livro2)" }));
    g.append(sv("path", { d: "M18 60 L40 36 L54 50 L66 40 L82 60 Z", fill: "var(--livro3)", opacity: .9 }));
    g.append(sv("path", { d: "M70 22 l2.4 5 5.4.7 -4 3.7 1 5.4 -4.8 -2.7 -4.8 2.7 1 -5.4 -4 -3.7 5.4 -.7 z", fill: "var(--brilho)" }));
    g.append(sv("rect", { x: 22, y: 50, width: 26, height: 5, rx: 1.5, fill: "#fff", opacity: .9 }));
  }
  return g;
}

/* ---- rodapé do escritório: agenda, caixa de aprovação e cofre */
function agenda(g, e) {
  g.append(sv("rect", { x: 4, y: 6, width: 100, height: 84, rx: 6, ...MOVEL }));
  g.append(sv("rect", { x: 4, y: 6, width: 100, height: 16, rx: 6, fill: "var(--marca)" }));
  g.append(sv("text", { x: 54, y: 18, "text-anchor": "middle", "font-size": 9.5, "font-weight": 800, fill: "var(--marca-texto)", texto: "🎼 MAESTRO · HOJE" }));
  const hoje = e.videos.filter((v) => v.producao_em.slice(0, 10) === e.hoje).sort((a, b) => a.producao_em.localeCompare(b.producao_em));
  hoje.slice(0, 3).forEach((v, i) => {
    const y = 36 + i * 15, cor = { agendado: "var(--suave)", em_producao: "var(--marca)", pausado: "var(--alerta)", falhou: "var(--erro)" }[v.status] || "var(--ok)";
    g.append(sv("circle", { cx: 13, cy: y - 3, r: 3, fill: cor }));
    g.append(sv("text", { x: 21, y, "font-size": 8.5, "font-weight": 700, fill: "var(--texto)", texto: `${hhmm(v.producao_em)} ${v.tema.length > 12 ? v.tema.slice(0, 11) + "…" : v.tema}` }));
  });
  if (!hoje.length) g.append(sv("text", { x: 54, y: 52, "text-anchor": "middle", "font-size": 8.5, fill: "var(--suave)", texto: "agenda vazia" }));
  if (hoje.length > 3) g.append(sv("text", { x: 54, y: 77, "text-anchor": "middle", "font-size": 8, fill: "var(--suave)", texto: `+${hoje.length - 3} mais hoje` }));
  const sub = e.videos.filter((v) => v.status === "agendado_no_canal").length;
  g.append(sv("text", { x: 54, y: 86, "text-anchor": "middle", "font-size": 8, fill: "var(--ok)", "font-weight": 700, texto: sub ? `📺 ${sub} agendado${sub > 1 ? "s" : ""} no canal` : "" }));
  g.append(sv("text", { class: "rotulo", x: 54, y: 108, texto: "AGENDA" }));
}
function caixa(g, n) {
  g.append(sv("text", { class: "rotulo", x: 50, y: 108, texto: "APROVAÇÃO" }));
  g.append(sv("rect", { x: 14, y: 52, width: 72, height: 30, rx: 5, fill: "var(--madeira)" }));
  g.append(sv("rect", { x: 14, y: 72, width: 72, height: 10, rx: 4, fill: "var(--madeira-esc)" }));
  const folhas = Math.min(n, 4);
  for (let i = 0; i < Math.max(folhas, 1); i++) {
    g.append(sv("rect", { x: 22 + i * 2, y: 46 - i * 6, width: 56, height: 10, rx: 2, fill: n ? "var(--papel)" : "none", stroke: "var(--movel-linha)", "stroke-dasharray": n ? "" : "3 3" }));
  }
  if (n) {
    const selo = sv("g");
    selo.append(sv("circle", { cx: 80, cy: 22, r: 11, fill: "var(--alerta)" }));
    selo.append(sv("text", { x: 80, y: 26, class: "selo-n", "font-size": 12, texto: String(n) }));
    selo.append(sv("animate", { attributeName: "opacity", values: "1;.6;1", dur: "1.8s", repeatCount: "indefinite" }));
    g.append(selo);
  }
}
function cofre(g, saldo) {
  g.append(sv("rect", { x: 20, y: 12, width: 66, height: 66, rx: 8, ...MOVEL }));
  g.append(sv("circle", { cx: 53, cy: 40, r: 17, fill: "none", stroke: "var(--movel-linha)", "stroke-width": 3 }));
  g.append(sv("circle", { cx: 53, cy: 40, r: 5, fill: saldo < 0 ? "var(--erro)" : "var(--ok)" }));
  [0, 60, 120, 180, 240, 300].forEach((a) => {
    const r = (a * Math.PI) / 180;
    g.append(sv("line", { x1: 53 + Math.cos(r) * 5, y1: 40 + Math.sin(r) * 5, x2: 53 + Math.cos(r) * 15, y2: 40 + Math.sin(r) * 15, stroke: "var(--movel-linha)", "stroke-width": 2 }));
  });
  g.append(sv("text", { class: "rotulo", x: 53, y: 108, texto: "COFRE" }));
  g.append(sv("text", { x: 53, y: 92, class: "moeda-txt", fill: saldo < 0 ? "var(--erro)" : "var(--ok)", texto: `🪙 ${moeda(saldo)}` }));
}

/* ---- cena principal. Os funcionários persistem entre atualizações para poderem andar até a próxima estação. */
const funcionarios = new Map();
let camadaFunc = null;
function montarCena() {
  const svg = $("cena");
  svg.replaceChildren();
  svg.append(sv("rect", { x: 0, y: 0, width: 360, height: 436, rx: 10, fill: "var(--piso)" }));
  svg.append(sv("rect", { x: 0, y: 0, width: 360, height: 8, fill: "var(--parede)" }));
  Object.entries(ESTACOES).forEach(([etapa, est]) => {
    const g = sv("g", { class: "estacao", id: "est-" + etapa, transform: `translate(${est.x} ${est.y})` });
    g.append(sv("rect", { class: "base pulso", x: 0, y: 0, width: 110, height: 134, rx: 12 }));
    const arteG = sv("g", { transform: "translate(5 2)" }); arteG.append(arte(etapa)); g.append(arteG);
    g.append(sv("text", { class: "rotulo", x: 55, y: 128, texto: est.nome.toUpperCase() }));
    svg.append(g);
  });
  const lin3 = 316;
  svg.append(sv("g", { id: "g-agenda", transform: `translate(12 ${lin3})` }));
  svg.append(sv("g", { id: "g-caixa", class: "toque", transform: `translate(125 ${lin3})`, role: "button", tabindex: 0, "aria-label": "Abrir vídeos para aprovar" }));
  svg.append(sv("g", { id: "g-cofre", transform: `translate(238 ${lin3})` }));
  camadaFunc = sv("g", { id: "funcs" });
  svg.append(camadaFunc);
  const abrir = () => mostrarAba("aprovar");
  $("cena").querySelector("#g-caixa").addEventListener("click", abrir);
  $("cena").querySelector("#g-caixa").addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); abrir(); } });
}

function novoFuncionario(v) {
  const cor = corDoCanal(v.canal);
  const g = sv("g", { class: "func" });
  const corpo = sv("g", { class: "corpo" });
  corpo.append(sv("ellipse", { cx: 0, cy: 12, rx: 9, ry: 2.4, fill: "#000", opacity: .15 }));
  corpo.append(sv("rect", { x: -7, y: -2, width: 14, height: 14, rx: 6, fill: cor }));
  corpo.append(sv("circle", { cx: 0, cy: -9, r: 7, fill: "#f2c9a0" }));
  corpo.append(sv("path", { d: "M-7 -10 Q0 -19 7 -10 Q0 -13 -7 -10 Z", fill: "#2b2f38" }));
  corpo.append(sv("text", { x: 0, y: 8.4, "text-anchor": "middle", "font-size": 6, "font-weight": 800, fill: "#fff", texto: iniciais(v.canal) }));
  g.append(corpo, sv("text", { class: "zzz", x: 9, y: -14, texto: "z z" }));
  return g;
}

function desenharCena() {
  const emProd = estado.videos.filter((v) => (v.status === "em_producao" || v.status === "pausado") && v.etapa);
  const porEstacao = {};
  emProd.forEach((v) => (porEstacao[v.etapa] ||= []).push(v));

  ETAPAS.forEach((etapa) => {
    const lista = porEstacao[etapa] || [];
    const g = $("est-" + etapa);
    g.classList.toggle("ativa", lista.some((v) => v.status === "em_producao"));
    g.classList.toggle("parada", lista.length > 0 && lista.every((v) => v.status === "pausado"));
  });

  const ids = new Set(emProd.map((v) => v.id));
  for (const [id, no] of funcionarios) if (!ids.has(id)) { no.remove(); funcionarios.delete(id); }
  for (const [etapa, lista] of Object.entries(porEstacao)) {
    const est = ESTACOES[etapa];
    lista.forEach((v, i) => {
      let no = funcionarios.get(v.id);
      const x = est.x + 55 + (i - (lista.length - 1) / 2) * 24, y = est.y + 100;
      if (!no) { no = novoFuncionario(v); no.style.transform = `translate(${x}px, ${y + 60}px)`; camadaFunc.append(no); funcionarios.set(v.id, no); void no.getBoundingClientRect(); }
      no.style.transform = `translate(${x}px, ${y}px)`;
      const pausado = v.status === "pausado";
      no.classList.toggle("parado", pausado);
      no.setAttribute("aria-label", `${v.canal}: ${pausado ? "pausado" : ESTACOES[etapa].verbo}`);
    });
  }

  const g = (id) => { const n = $(id); n.replaceChildren(); return n; };
  agenda(g("g-agenda"), estado);
  caixa(g("g-caixa"), estado.pendentes.length);
  cofre(g("g-cofre"), estado.saldo);
}

function desenharLegenda() {
  const l = $("legenda");
  l.replaceChildren();
  const ativos = estado.videos.filter((v) => (v.status === "em_producao" || v.status === "pausado") && v.etapa);
  if (!ativos.length) {
    const prox = estado.videos.filter((v) => v.status === "agendado").sort((a, b) => a.producao_em.localeCompare(b.producao_em))[0];
    l.append(el("div", { class: "vazio", texto: prox ? `Ninguém na linha agora. Próximo: ${prox.tema} (${quando(prox.producao_em)}).` : "Ninguém na linha agora. 😴" }));
    return;
  }
  for (const v of ativos) {
    const pausado = v.status === "pausado";
    const txt = pausado
      ? `parado na etapa “${ESTACOES[v.etapa].nome.toLowerCase()}”${v.retomar_em ? ` · retoma ${hhmm(v.retomar_em)}` : ""}`
      : `${ESTACOES[v.etapa].verbo} (${v.etapas_feitas + 1}/${v.etapas_total})`;
    l.append(el("div", { class: "func-linha" },
      el("div", { class: "avatar", style: `background:${corDoCanal(v.canal)}`, texto: iniciais(v.canal) }),
      el("div", { class: "txt" }, el("strong", { texto: v.tema }), el("div", { class: "meta", texto: `${v.canal} · ${txt}` }),
        el("div", { class: "barra" }, el("i", { style: `width:${(v.etapas_feitas / v.etapas_total) * 100}%` })))));
  }
}

function desenharExtrato() {
  const x = $("extrato");
  x.replaceChildren();
  if (!estado.historico.length) { x.append(el("div", { class: "vazio", texto: "Sem movimentações ainda." })); return; }
  const tema = (id) => (estado.videos.find((v) => v.id === id) || {}).tema || id;
  for (const h of estado.historico) {
    x.append(el("div", { class: "linha" },
      el("div", {}, el("strong", { texto: h.tipo === "despesa" ? "Produção" : "Views" }), el("div", { class: "meta", texto: tema(h.video) })),
      el("span", { class: "v " + (h.valor < 0 ? "neg" : "pos"), texto: (h.valor > 0 ? "+" : "−") + moeda(Math.abs(h.valor)) })));
  }
}

const CAMPOS_PERFIL = [["voz", "Voz"], ["estilo_voz", "Jeito de falar"], ["tom", "Tom"], ["publico", "Público"],
  ["estilo_visual", "Estilo visual"], ["cenas", "Cenas por vídeo"], ["categoria_youtube", "Categoria YouTube"], ["idioma", "Idioma"]];
function desenharCanais() {
  const area = $("canais");
  area.replaceChildren();
  if (!estado.canais.length) { area.append(el("div", { class: "vazio", texto: "Nenhum canal configurado." })); return; }
  for (const c of estado.canais) {
    const lista = el("dl");
    for (const [chave, rotulo] of CAMPOS_PERFIL) if (c.perfil[chave]) lista.append(el("dt", { texto: rotulo }), el("dd", { texto: String(c.perfil[chave]) }));
    if ((c.perfil.evitar || []).length) lista.append(el("dt", { texto: "Evita" }), el("dd", { texto: c.perfil.evitar.join(" · ") }));
    area.append(el("section", { class: "canal", style: `--cor:${corDoCanal(c.nome)}` },
      el("h3", { texto: c.nome }),
      el("div", { class: "sub", texto: `${c.nicho || "sem nicho"} · começa às ${c.inicio} · ${c.temas} tema${c.temas === 1 ? "" : "s"} na fila` }),
      lista.children.length ? lista : el("div", { class: "vazio-perfil", texto: "Sem perfil: usa as vozes e estilos padrão." })));
  }
}

function mostrarAba(qual) {
  const esc = qual === "escritorio";
  $("painel-escritorio").hidden = !esc;
  $("painel-aprovar").hidden = esc;
  $("aba-escritorio").setAttribute("aria-selected", esc);
  $("aba-aprovar").setAttribute("aria-selected", !esc);
  window.scrollTo({ top: 0 });
}
$("aba-escritorio").onclick = () => mostrarAba("escritorio");
$("aba-aprovar").onclick = () => mostrarAba("aprovar");
montarCena();

async function atualizar() {
  try { estado = await api("/api/estado"); estado.hoje = estado.agora.slice(0, 10); desenhar(); } catch (e) { if (e.message !== "401") console.error(e); }
}
atualizar();
setInterval(atualizar, 10000);
</script>
